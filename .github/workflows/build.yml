name: Build PouMemoryBot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -q PouMemoryBot.zip
          find . -maxdepth 3 -name settings.gradle -o -name settings.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd PouMemoryBotNuevo/PouMemoryBot
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PouMemoryBot-debug
          path: PouMemoryBotNuevo/PouMemoryBot/app/build/outputs/apk/debug/*.apk
